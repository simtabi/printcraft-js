name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # npm 10, which Node 22 bundles, crashes in arborist's peer-set loader
      # ("Cannot read properties of null (reading 'edgesOut')") on vitest's
      # optional @vitest/browser-playwright peer. npm 11 resolves it.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install
        run: npm install --no-package-lock

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run format:check
          npm test
          npm run lint:pkg
          npm run size

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag does not match package.json version $pkg" >&2
            exit 1
          fi

      # every release carries a real description, taken from that version's
      # CHANGELOG section — never a bare "see CHANGELOG" stub
      - name: Extract the changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[?" v "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG section found for $version" >&2
            exit 1
          fi
          cat release-notes.md

      # prepublishOnly runs the full build, so a stale dist can never ship
      - name: Publish to npm
        run: npm publish --access public
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
