name: Static analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyse:
    name: Types, lint, format, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # npm 10, which Node 22 bundles, crashes in arborist's peer-set loader
      # ("Cannot read properties of null (reading 'edgesOut')") on vitest's
      # optional @vitest/browser-playwright peer. npm 11 resolves it.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Install
        run: npm install --no-package-lock

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Build
        run: npm run build

      # publint checks the published metadata; attw checks that import, require
      # and node16 type resolution all land on a real declaration file
      - name: Package correctness
        run: npm run lint:pkg
