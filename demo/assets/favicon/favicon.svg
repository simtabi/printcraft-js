<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Printcraft">
  <title>Printcraft</title>
  <rect width="64" height="64" rx="10" fill="#17181b"/>
  <!-- the sheet -->
  <rect x="14" y="12" width="36" height="40" rx="2" fill="#ffffff"/>
  <!-- the four process inks, in press order -->
  <rect x="14" y="12" width="9" height="6" fill="#009fe3"/>
  <rect x="23" y="12" width="9" height="6" fill="#e5007d"/>
  <rect x="32" y="12" width="9" height="6" fill="#ffd500"/>
  <rect x="41" y="12" width="9" height="6" fill="#17181b"/>
  <!-- ruled lines standing in for content -->
  <rect x="20" y="26" width="24" height="3" fill="#55575e"/>
  <rect x="20" y="34" width="24" height="3" fill="#55575e"/>
  <rect x="20" y="42" width="14" height="3" fill="#55575e"/>
</svg>
